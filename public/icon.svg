<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Midnight Royal Navy -->
    <linearGradient id="cfBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#002D88"/>
      <stop offset="100%" stop-color="#040817"/>
    </linearGradient>

    <!-- Metallic White Gradient -->
    <linearGradient id="cfWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Speed Orange Gradient -->
    <linearGradient id="cfOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA800"/>
      <stop offset="50%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#E63900"/>
    </linearGradient>

    <!-- Electric Blue Accent Gradient -->
    <linearGradient id="cfBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0055FE"/>
      <stop offset="100%" stop-color="#00D5FF"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="cfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop Shadow -->
    <filter id="cfShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield Badge -->
  <rect width="512" height="512" rx="110" fill="url(#cfBgGrad)"/>
  
  <!-- Sleek Bevel Border Rings -->
  <rect x="14" y="14" width="484" height="484" rx="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4"/>
  <rect x="24" y="24" width="464" height="464" rx="86" fill="none" stroke="url(#cfBlueGrad)" stroke-width="6" filter="url(#cfGlow)"/>

  <!-- ==================== CLEAN AUTOMOTIVE EMBLEM ==================== -->
  <g filter="url(#cfShadow)" transform="translate(0, -15)">
    
    <!-- Aerodynamic Car Roof Arc -->
    <path d="M 130 180 C 180 110 260 90 355 105 C 400 115 435 142 455 180 Z" 
          fill="none" 
          stroke="url(#cfWhiteGrad)" 
          stroke-width="18" 
          stroke-linecap="round"/>

    <!-- Speed Orange Flame Wing Arc -->
    <path d="M 40 215 Q 235 140 485 170" 
          fill="none" 
          stroke="url(#cfOrangeGrad)" 
          stroke-width="20" 
          stroke-linecap="round"
          filter="url(#cfGlow)"/>

    <!-- Sports Car Body Base Shell -->
    <path d="M 60 260 C 85 195 140 165 225 155 C 295 145 380 145 435 155 C 475 165 495 200 500 260 L 500 275 C 500 288 488 298 475 298 L 445 298 C 443 260 408 232 368 232 C 328 232 293 260 291 298 L 193 298 C 191 260 156 232 116 232 C 76 232 41 260 39 298 L 25 298 C 12 298 2 288 2 275 Z" 
          fill="url(#cfWhiteGrad)"/>

    <!-- LED Cyan Headlight Strip -->
    <path d="M 465 225 C 485 225 497 238 497 250 L 445 250 Z" fill="#00D5FF" filter="url(#cfGlow)"/>

    <!-- Wheels -->
    <circle cx="116" cy="298" r="40" fill="#040817" stroke="#FFFFFF" stroke-width="8"/>
    <circle cx="116" cy="298" r="18" fill="#0055FE"/>
    <circle cx="116" cy="298" r="7" fill="#FF6B00"/>

    <circle cx="368" cy="298" r="40" fill="#040817" stroke="#FFFFFF" stroke-width="8"/>
    <circle cx="368" cy="298" r="18" fill="#0055FE"/>
    <circle cx="368" cy="298" r="7" fill="#00D5FF"/>

    <!-- Bold CF Monogram Overlay -->
    <g transform="translate(240, 185)" filter="url(#cfGlow)">
      <path d="M -30 -25 C -52 -25 -65 -10 -65 10 C -65 30 -52 45 -30 45 C -18 45 -8 40 0 30 L -10 20 C -15 25 -22 28 -30 28 C -40 28 -48 20 -48 10 C -48 0 -40 -8 -30 -8 C -22 -8 -15 -5 -10 0 L 0 -10 C -8 -18 -18 -25 -30 -25 Z" fill="url(#cfWhiteGrad)" stroke="#040817" stroke-width="4"/>
      <path d="M 8 -20 L 58 -20 L 53 -5 L 24 -5 L 21 8 L 48 8 L 43 22 L 18 22 L 12 40 L -6 40 Z" fill="url(#cfOrangeGrad)" stroke="#040817" stroke-width="4"/>
    </g>
  </g>

  <!-- ==================== "CarFever" TYPOGRAPHY ==================== -->
  <g transform="translate(256, 430)" text-anchor="middle" filter="url(#cfShadow)">
    <text x="0" y="0" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="72" letter-spacing="3" fill="#000000" stroke="#000000" stroke-width="12" stroke-linejoin="round">CarFever</text>
    <text x="0" y="0" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="72" letter-spacing="3">
      <tspan fill="#FFFFFF">Car</tspan><tspan fill="url(#cfOrangeGrad)">Fever</tspan>
    </text>
    <text x="0" y="34" font-family="'Inter', sans-serif" font-weight="800" font-size="20" letter-spacing="8" fill="#CBD5E1">MARKETPLACE</text>
  </g>
</svg>
